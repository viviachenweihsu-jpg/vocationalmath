<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學B 課堂活動</title>

<style>
:root{--bg:#FBFAF7;--surface:#FFFFFF;--ink:#3A4650;--muted:#667482;--line:#E6E9EC;--pond:#5B7A8C;--pond-soft:#E3ECF1;--yuzu:#F2D9D0;--good:#4F7A5C;--warn:#8A6A3A;--bad:#B0524A;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Zen Maru Gothic",sans-serif;line-height:1.7;font-size:17px}
h1,h2,h3,.tab{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0;flex:1;color:var(--pond)}
.who{font-size:14px;color:var(--muted)}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pond);border-color:var(--pond);font-weight:700}
main{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--pond);border-color:var(--pond);color:#fff}
.btn{border:1px solid var(--pond);background:var(--pond);color:#fff;border-radius:12px;padding:10px 18px;font-size:16px;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--surface);color:var(--pond)}
.btn:disabled{opacity:.45;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--pond-soft)}
.opt.right{border-color:var(--good);background:#E7F0E9}
.opt.wrong{border-color:var(--bad);background:#F6E6E4}
.ex{background:var(--pond-soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15.5px}
.muted{color:var(--muted);font-size:14px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--pond)}
.flip{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:var(--yuzu);border:0;font-size:20px;border-radius:var(--r);padding:20px}
.flip.back{background:var(--pond-soft)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;width:130px}
.tbtn{font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.tbtn.on{background:var(--yuzu);color:var(--ink)}
body.proj{font-size:24px}
body.proj .ex{font-size:21px}
ol.steps li{margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
#login{position:fixed;inset:0;background:rgba(58,70,80,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#login .card{max-width:380px;width:100%}
</style>
</head>
<body>
<header>
 <div class="bar"><h1>數學B・指數對數與數列級數</h1>
  <span class="who" id="who"></span>

  <button class="tbtn" id="btnTea">教師解答</button>

</div></div>
<script>
const UNITS=[{"id": "mathb_u1_1", "title": "指數對數與數列級數（1-1）指數律與指數函數", "subject": "數學B", "kind": "quiz", "on": true, "desc": "指數律與指數函數：5 題，由易到難", "intro": "單元 1-1：指數律與指數函數", "createdAt": "2026-10-27", "pass": true, "quiz": [{"q": "$\\frac{2^5\\cdot 2^4}{2^6}$ 的值為何？", "opts": ["32768", "16", "8", "64"], "ans": 2, "ex": "關鍵公式：$a^m\\cdot a^n=a^{m+n}$，$\\frac{a^m}{a^n}=a^{m-n}$。計算：$2^{5+4-6}=2^3=8$。常見錯誤：把分母指數也相加得 $2^{15}$，或少減一項。其他選項：16 是 $2^4$（漏算一個指數），32768 是 $2^{15}$，64 是 $2^6$（只看分母）。"}, {"q": "$8^{\\frac23}$ 的值為何？", "opts": ["4", "16", "2", "6"], "ans": 0, "ex": "關鍵公式：$a^{\\frac mn}=(\\sqrt[n]{a})^m$。計算：$\\sqrt[3]{8}=2$，再平方得 $2^2=4$。常見錯誤：把 $\\frac23$ 當成 $2\\times3=6$，或只開立方根忘了平方得 2。16 是 $8\\cdot 2$ 的誤算。"}, {"q": "$27^{-\\frac23}$ 的值為何？", "opts": ["$9$", "$-9$", "$\\frac1{18}$", "$\\frac19$"], "ans": 3, "ex": "關鍵公式：$a^{-p}=\\frac1{a^p}$。計算：$27^{\\frac23}=(\\sqrt[3]{27})^2=9$，故 $27^{-\\frac23}=\\frac19$。常見錯誤：忘了負號代表倒數得 9；把負號當成負數得 $-9$（指數函數值恆正）；$\\frac1{18}$ 是 $\\frac1{27\\cdot\\frac23}$ 的亂湊。"}, {"q": "設 $f(x)=3^x$，則 $f(2)+f(-1)$ 的值為何？", "opts": ["$\\frac{26}{3}$", "$\\frac{28}{3}$", "$\\frac{25}{3}$", "$8$"], "ans": 1, "ex": "關鍵公式：$a^{-1}=\\frac1a$。計算：$f(2)=9$，$f(-1)=\\frac13$，和為 $\\frac{28}{3}$。常見錯誤：把 $f(-1)$ 算成 $-3$ 得 6，或 $9-\\frac13=\\frac{26}{3}$；8 是 $f(2)-1$。"}, {"q": "化簡 $\\sqrt[3]{64^2\\sqrt{64}}$ 的值為何？", "opts": ["16", "32", "64", "8"], "ans": 1, "ex": "關鍵公式：化成同底指數。計算：$64^2\\cdot64^{\\frac12}=64^{\\frac52}$，開立方得 $64^{\\frac56}=(2^6)^{\\frac56}=2^5=32$。常見錯誤：漏掉根號內的 $\\sqrt{64}$ 得 $64^{\\frac23}=16$；以為 $\\sqrt[3]{\\ }$ 抵消得 64；8 是 $64^{\\frac12}$。"}], "tcte": [{"q": "設 $a^x=3$，則 $\\frac{a^{3x}-a^{-3x}}{a^x-a^{-x}}$ 的值為何？", "opts": ["$9$", "$\\frac{91}{9}$", "$\\frac{28}{3}$", "$10$"], "ans": 1, "ex": "關鍵公式：$\\frac{u^3-u^{-3}}{u-u^{-1}}=u^2+1+u^{-2}$（令 $u=a^x$）。計算：$9+1+\\frac19=\\frac{91}9$。常見錯誤：只算 $u^2=9$；$\\frac{28}3$ 是 $27+\\frac13$ 之類的誤拆。"}, {"q": "函數 $f(x)=2^{x-1}+3$ 的圖形與 $y$ 軸交點的 $y$ 坐標為何？", "opts": ["3", "$\\frac12$", "4", "$\\frac72$"], "ans": 3, "ex": "關鍵公式：與 $y$ 軸交點即 $x=0$。計算：$f(0)=2^{-1}+3=\\frac72$。常見錯誤：把 $2^{-1}$ 當 $-2$；漏掉 $+3$ 得 $\\frac12$；4 是 $2^{1}+...$ 誤代 $x=1$（$f(1)=4$）。"}, {"q": "設 $a=2^{\\frac12},\\ b=3^{\\frac13},\\ c=6^{\\frac16}$，則 $a,b,c$ 的大小關係為何？", "opts": ["$a>c>b$", "$c>a>b$", "$b>a>c$", "$a>b>c$"], "ans": 2, "ex": "關鍵公式：同次方比較，取公分母次方。計算：6 次方後 $a^6=8,\\ b^6=9,\\ c^6=6$，故 $b>a>c$。常見錯誤：只比底數大小；以為指數越小值越大。"}], "cards": [{"front": "同底數相乘", "back": "$a^m\\cdot a^n=a^{m+n}$，指數相加。"}, {"front": "指數律：冪的冪", "back": "$(a^m)^n=a^{mn}$。"}, {"front": "負指數", "back": "$a^{-n}=\\frac1{a^n}$，指數函數值恆正。"}, {"front": "分數指數", "back": "$a^{\\frac mn}=(\\sqrt[n]{a})^m$。"}, {"front": "指數函數單調性", "back": "$a>1$ 遞增；$0<a<1$ 遞減；圖形恆過 $(0,1)$。"}], "quick": [1, 3, 4], "task": {"title": "細菌倍增", "scenario": "某培養皿細菌每小時變為 3 倍，起初 $2$ 單位。", "steps": ["寫出第 $n$ 小時數量 $f(n)=2\\cdot3^n$", "列表求 0–4 小時數量", "討論 $n=-1$ 的意義"], "answer": "$f(n)=2\\cdot3^n$；0–4 小時：2、6、18、54、162；$n=-1$ 表示 1 小時前，為 $\\frac23$。", "time": "15 分鐘：5 分鐘列式、5 分鐘列表、5 分鐘討論分享"}}, {"id": "mathb_u1_2", "title": "指數對數與數列級數（1-2）對數的定義與性質", "subject": "數學B", "kind": "quiz", "on": true, "desc": "對數的定義與性質：5 題，由易到難", "intro": "單元 1-2：對數的定義與性質", "createdAt": "2026-10-27", "pass": true, "quiz": [{"q": "$\\log_2 32$ 的值為何？", "opts": ["16", "6", "4", "5"], "ans": 3, "ex": "關鍵公式：$\\log_a N=x\\iff a^x=N$。計算：$2^5=32$，故為 5。常見錯誤：$2^4=16$、$2^6=64$ 數錯次方；16 是 $32\\div2$。"}, {"q": "$\\log_3 12+\\log_3\\frac94$ 的值為何？", "opts": ["3", "27", "$\\log_3 21$", "6"], "ans": 0, "ex": "關鍵公式：$\\log_a M+\\log_a N=\\log_a MN$。計算：$12\\cdot\\frac94=27$，$\\log_3 27=3$。常見錯誤：把對數值當數字直接乘得 27；$\\log_3 21$ 是把真數相加。6 是 $2\\times3$ 亂湊。"}, {"q": "已知 $\\log_2 3=a$，則 $\\log_2 12$ 用 $a$ 表示為何？", "opts": ["$3a$", "$a+3$", "$a+2$", "$2a$"], "ans": 2, "ex": "關鍵公式：$\\log_2 12=\\log_2(3\\cdot4)=\\log_2 3+\\log_2 4$。計算：$a+2$。常見錯誤：把乘法拆成乘積 $2a$、$3a$；$a+3$ 是誤把 $\\log_2 4$ 當 3。"}, {"q": "$\\log_4 8$ 的值為何？", "opts": ["$\\frac12$", "$2$", "$\\frac23$", "$\\frac32$"], "ans": 3, "ex": "關鍵公式：換底 $\\log_{a^k}b^m=\\frac mk\\log_a b$。計算：$\\log_{2^2}2^3=\\frac32$。常見錯誤：分子分母顛倒得 $\\frac23$；$8\\div4=2$ 是把對數當除法。"}, {"q": "$\\log_2 3\\cdot\\log_3 5\\cdot\\log_5 8$ 的值為何？", "opts": ["15", "3", "1", "8"], "ans": 1, "ex": "關鍵公式：換底 $\\log_a b=\\frac{\\log b}{\\log a}$，連乘可約分。計算：$\\frac{\\log3}{\\log2}\\cdot\\frac{\\log5}{\\log3}\\cdot\\frac{\\log8}{\\log5}=\\frac{\\log8}{\\log2}=\\log_2 8=3$。常見錯誤：把底數真數直接乘；15 是 $3\\times5$，8 是只取最後真數。"}], "tcte": [{"q": "設 $\\log_23=a$，則 $\\log_{12}18$ 可表為何？", "opts": ["$\\frac{1+2a}{2+a}$", "$\\frac{1+a}{2+a}$", "$\\frac{2+a}{1+2a}$", "$\\frac{1+2a}{2a}$"], "ans": 0, "ex": "關鍵公式：換底 $\\log_{12}18=\\frac{\\log_218}{\\log_212}$。計算：$\\log_218=1+2a$，$\\log_212=2+a$。常見錯誤：把 $18=2\\cdot3^2$ 的指數 2 漏掉；分子分母顛倒。"}, {"q": "若 $2^a=3^b=6$，則 $\\frac1a+\\frac1b$ 的值為何？", "opts": ["6", "$\\frac16$", "2", "1"], "ans": 3, "ex": "關鍵公式：$a=\\log_26,\\ b=\\log_36$，$\\frac1a=\\log_62$。計算：$\\log_62+\\log_63=\\log_66=1$。常見錯誤：直接把 $a,b$ 當 6 的次方而相加；忘記倒數換底。"}, {"q": "$\\log_5\\sqrt{50}-\\frac12\\log_52$ 的值為何？", "opts": ["2", "1", "$\\frac32$", "$\\frac12$"], "ans": 1, "ex": "關鍵公式：$\\log_a\\sqrt N=\\frac12\\log_aN$，差化商。計算：$\\frac12(\\log_550-\\log_52)=\\frac12\\log_525=\\frac12\\cdot2=1$。常見錯誤：忘記根號對應 $\\frac12$；算成 $\\log_525=2$。"}], "cards": [{"front": "對數定義", "back": "$\\log_aN=x\\iff a^x=N$（$a>0,a\\ne1,N>0$）。"}, {"front": "對數和差", "back": "$\\log_aM+\\log_aN=\\log_aMN$；$\\log_aM-\\log_aN=\\log_a\\frac MN$。"}, {"front": "次方下放", "back": "$\\log_aM^k=k\\log_aM$。"}, {"front": "換底公式", "back": "$\\log_ab=\\frac{\\log_cb}{\\log_ca}$。"}, {"front": "連鎖約分", "back": "$\\log_ab\\cdot\\log_bc=\\log_ac$。"}], "quick": [1, 3, 4], "task": {"title": "地震規模", "scenario": "規模每增加 1，能量約為 10 倍；規模 5 與規模 7 能量相差幾倍？", "steps": ["以 $E=10^M$ 建立關係", "計算比值", "反推：能量 $10^{9}$ 倍對應規模差多少"], "answer": "$10^7\\div10^5=100$ 倍；$10^9$ 倍對應規模差 $\\log10^9=9$。", "time": "18 分鐘：6 建模、6 計算、6 分享"}}, {"id": "mathb_u1_3", "title": "指數對數與數列級數（1-3）對數函數與常用對數", "subject": "數學B", "kind": "quiz", "on": true, "desc": "對數函數與常用對數：5 題，由易到難", "intro": "單元 1-3：對數函數與常用對數", "createdAt": "2026-10-27", "pass": true, "quiz": [{"q": "已知 $\\log 2=0.3010$，則 $\\log 2000$ 的首數為何？", "opts": ["2", "0", "3", "4"], "ans": 2, "ex": "關鍵公式：$\\log 2000=\\log2+3=3.3010$，整數部分為首數。首數 3。常見錯誤：以為首數等於位數 4；2000 有 4 位數，首數是位數減 1。"}, {"q": "已知 $\\log 2=0.3010$，則 $\\log 0.004$ 的尾數為何？", "opts": ["0.6020", "0.3980", "0.6990", "0.3010"], "ans": 0, "ex": "關鍵公式：$\\log4=2\\log2=0.6020$，$\\log0.004=\\log4-3=-3+0.6020$，尾數取 0 到 1 之間，故為 0.6020。常見錯誤：寫成 $-2.3980$ 後把 $0.3980$ 當尾數；0.6990 是 $\\log5$；0.3010 是 $\\log2$。"}, {"q": "已知 $\\log 2=0.3010$，則 $2^{40}$ 是幾位數？", "opts": ["13", "14", "40", "12"], "ans": 0, "ex": "關鍵公式：$N$ 為 $n$ 位數 $\\iff$ $\\log N$ 的首數為 $n-1$。計算：$\\log2^{40}=40\\times0.3010=12.04$，首數 12，故 13 位數。常見錯誤：直接取 12.04 的整數部分當位數；14 是進位誤判。"}, {"q": "下列四數何者最大？", "opts": ["$\\log_3 2$", "$\\log_{\\frac13}2$", "$\\log_2 3$", "$\\log_{\\frac12}3$"], "ans": 2, "ex": "關鍵公式：底數大於 1 時 $\\log_a x$ 遞增；底數介於 0 與 1 時為負（真數大於 1）。數值：$\\log_23\\approx1.58$，$\\log_32\\approx0.63$，$\\log_{\\frac12}3\\approx-1.58$，$\\log_{\\frac13}2\\approx-0.63$。故最大為 $\\log_23$。常見錯誤：忽略底數小於 1 時的負號。"}, {"q": "已知 $\\log 2=0.3010$，則 $(\\frac12)^{20}$ 化為小數後，從小數點後第幾位開始不為 0？", "opts": ["第 20 位", "第 7 位", "第 8 位", "第 6 位"], "ans": 1, "ex": "關鍵公式：$\\log N=-k+$尾數 $\\Rightarrow$ 小數第 $k$ 位開始不為 0。計算：$\\log(\\frac12)^{20}=-20\\times0.3010=-6.02=-7+0.98$，首數 $-7$，故第 7 位。常見錯誤：取 $-6$ 為位數（忘了負數需向下取整）；20 是指數誤當位數。"}], "tcte": [{"q": "已知 $\\log2=0.3010,\\ \\log3=0.4771$，則 $6^{20}$ 是幾位數？", "opts": ["20", "16", "17", "15"], "ans": 1, "ex": "關鍵公式：$\\log6=\\log2+\\log3=0.7781$，位數＝首數＋1。計算：$20\\times0.7781=15.562$，首數 15，故 16 位數。常見錯誤：把 15.562 當位數；首數忘記 $+1$ 得 15。"}, {"q": "已知 $\\log3=0.4771$，則 $0.3^{10}$ 化成小數後，第一個不為 0 的數字出現在小數點後第幾位？", "opts": ["第 7 位", "第 5 位", "第 10 位", "第 6 位"], "ans": 3, "ex": "關鍵公式：首數為 $-k$ 時，小數點後第 $k$ 位開始不為 0。計算：$\\log0.3^{10}=10(0.4771-1)=-5.229=-6+0.771$，首數 $-6$，第 6 位。常見錯誤：取 $-5.229$ 的整數部分 $-5$；以為指數 10 就是第 10 位。"}, {"q": "已知 $\\log2=0.3010$，滿足 $2^n>10^6$ 的最小正整數 $n$ 為何？", "opts": ["20", "21", "19", "30"], "ans": 0, "ex": "關鍵公式：兩邊取常用對數，不等號不變（底 10>1）。計算：$n\\times0.3010>6\\Rightarrow n>19.93$，最小整數 20。常見錯誤：無條件捨去得 19；$2^{20}=1048576$ 可驗證。"}], "cards": [{"front": "首數與尾數", "back": "$\\log N=$ 首數（整數）＋尾數（$0\\le$尾數$<1$）。"}, {"front": "位數判斷", "back": "首數 $n$ $\\Rightarrow$ $N$ 為 $n+1$ 位整數。"}, {"front": "小數首位", "back": "首數 $-k$ $\\Rightarrow$ 小數點後第 $k$ 位開始不為 0。"}, {"front": "對數函數圖形", "back": "$y=\\log_ax$ 恆過 $(1,0)$，與 $y=a^x$ 對稱於 $y=x$。"}, {"front": "比較大小", "back": "$a>1$ 遞增；$0<a<1$ 遞減。"}], "quick": [1, 3, 4], "task": {"title": "位數估計", "scenario": "已知 $\\log2=0.3010,\\log3=0.4771$。估算 $2^{50}$ 與 $3^{30}$ 各為幾位數。", "steps": ["各自取常用對數", "決定首數", "比較哪個較大"], "answer": "$50\\times0.3010=15.05\\to16$ 位；$30\\times0.4771=14.313\\to15$ 位；$2^{50}$ 較大。", "time": "15 分鐘：各 5 分鐘計算，5 分鐘討論誤差"}}, {"id": "mathb_u1_4", "title": "指數對數與數列級數（1-4）指數對數方程式與不等式", "subject": "數學B", "kind": "quiz", "on": true, "desc": "指數對數方程式與不等式：5 題，由易到難", "intro": "單元 1-4：指數對數方程式與不等式", "createdAt": "2026-10-27", "pass": true, "quiz": [{"q": "解 $2^{x+1}=32$，$x=$？", "opts": ["16", "5", "3", "4"], "ans": 3, "ex": "關鍵公式：同底數比較指數。計算：$2^{x+1}=2^5\\Rightarrow x+1=5\\Rightarrow x=4$。常見錯誤：忘了減 1 得 5；16 是 $32\\div2$。"}, {"q": "方程式 $9^x-4\\cdot3^x+3=0$ 所有實數解之和為何？", "opts": ["4", "3", "1", "0"], "ans": 2, "ex": "關鍵公式：令 $t=3^x>0$ 換元。計算：$t^2-4t+3=0\\Rightarrow t=1$ 或 $3$，即 $x=0$ 或 $1$，和為 1。常見錯誤：把 $t$ 當成 $x$（解 1 與 3 之和為 4）；3 是 $t$ 的積。"}, {"q": "解 $\\log_2(x-1)+\\log_2(x+1)=3$，$x=$？", "opts": ["3", "9", "$3$ 或 $-3$", "$-3$"], "ans": 0, "ex": "關鍵公式：真數須大於 0，故 $x>1$。計算：$\\log_2(x^2-1)=3\\Rightarrow x^2-1=8\\Rightarrow x=\\pm3$，$x=-3$ 不合（真數為負）。答案 $x=3$。常見錯誤：未檢驗真數條件而保留 $-3$；9 是把 $x^2=9$ 當 $x$。"}, {"q": "解不等式 $(\\frac12)^{2x-1}<\\frac18$。", "opts": ["$x<1$", "$x>1$", "$x<2$", "$x>2$"], "ans": 3, "ex": "關鍵公式：底數介於 0 與 1，指數函數遞減，不等號要反向。計算：$(\\frac12)^{2x-1}<(\\frac12)^3\\Rightarrow2x-1>3\\Rightarrow x>2$。常見錯誤：沒改變不等號方向得 $x<2$；$x>1$ 是少算一步。"}, {"q": "解不等式 $\\log_3(2x-1)\\le2$。", "opts": ["$x<5$", "$\\frac12<x\\le5$", "$0<x\\le5$", "$x\\le5$"], "ans": 1, "ex": "關鍵公式：底數大於 1 不等號方向不變，且真數須大於 0。計算：$0<2x-1\\le9\\Rightarrow\\frac12<x\\le5$。常見錯誤：只解右側而漏掉真數條件（$x\\le5$）；把 $\\le$ 寫成 $<$。"}], "tcte": [{"q": "方程式 $\\log_2(x-1)+\\log_2(x+1)=3$ 的解為何？", "opts": ["$\\pm3$", "$-3$", "$3$", "$9$"], "ans": 2, "ex": "關鍵公式：和化積 $\\log_2(x^2-1)=3$，且真數需 $x>1$。計算：$x^2-1=8\\Rightarrow x=\\pm3$，檢驗後取 $x=3$。常見錯誤：忘記檢驗保留 $-3$；9 是把 $x^2=9$ 當答案。"}, {"q": "方程式 $4^x-5\\cdot2^x+4=0$ 所有實數解的和為何？", "opts": ["4", "5", "0", "2"], "ans": 3, "ex": "關鍵公式：令 $t=2^x>0$，得 $t^2-5t+4=0$。計算：$t=1,4\\Rightarrow x=0,2$，和為 2。常見錯誤：把 $t$ 的和 5 當答案；忘記回代。"}, {"q": "滿足 $\\log_{\\frac12}(x-1)>-2$ 的整數 $x$ 共有幾個？", "opts": ["2", "3", "5", "4"], "ans": 1, "ex": "關鍵公式：底 $\\frac12<1$，不等號反向；真數 $x-1>0$。計算：$x-1<(\\frac12)^{-2}=4$，故 $1<x<5$，整數 2,3,4 共 3 個。常見錯誤：不等號沒反向得 $x>5$；忘記 $x>1$。"}], "cards": [{"front": "同底法", "back": "化為 $a^{f(x)}=a^{g(x)}$，再令 $f=g$。"}, {"front": "換元法", "back": "令 $t=a^x>0$，解二次式後記得回代。"}, {"front": "對數方程式", "back": "先寫真數大於 0，解完必檢驗。"}, {"front": "不等式方向", "back": "$a>1$ 方向不變；$0<a<1$ 方向反轉。"}, {"front": "定義域優先", "back": "$\\log_a f(x)$ 需 $f(x)>0$。"}], "quick": [1, 3, 4], "task": {"title": "藥物濃度", "scenario": "血中藥物濃度每小時剩 $\\frac12$，起初 $64$ 單位。何時濃度首次低於 $1$？", "steps": ["列出 $64(\\frac12)^t$", "解不等式", "討論整點與連續時間"], "answer": "$64(\\frac12)^t<1\\Rightarrow2^{6-t}<1\\Rightarrow t>6$，第 7 個整點小時。", "time": "18 分鐘：6 列式、6 解不等式、6 討論"}}, {"id": "mathb_u1_5", "title": "指數對數與數列級數（1-5）等差、等比數列與級數", "subject": "數學B", "kind": "quiz", "on": true, "desc": "等差、等比數列與級數：5 題，由易到難", "intro": "單元 1-5：等差、等比數列與級數", "createdAt": "2026-10-27", "pass": true, "quiz": [{"q": "等差數列首項 5、公差 3，則第 10 項為何？", "opts": ["35", "32", "29", "30"], "ans": 1, "ex": "關鍵公式：$a_n=a_1+(n-1)d$。計算：$5+9\\times3=32$。常見錯誤：用 $nd$ 得 35；用 $n-2$ 得 29。"}, {"q": "等差數列首項 3、公差 4，前 12 項和為何？", "opts": ["288", "150", "312", "300"], "ans": 3, "ex": "關鍵公式：$S_n=\\frac n2[2a_1+(n-1)d]$。計算：$6\\times(6+44)=300$。常見錯誤：漏乘 $\\frac n2$ 得 50 的倍數；150 是少乘 2；312 是用 $(n)d$ 誤算。"}, {"q": "等比數列首項 3、公比 2，則第 6 項為何？", "opts": ["96", "48", "36", "192"], "ans": 0, "ex": "關鍵公式：$a_n=a_1r^{n-1}$。計算：$3\\cdot2^5=96$。常見錯誤：用 $r^n$ 得 192；用 $r^{n-2}$ 得 48；36 是 $3\\times6\\times2$。"}, {"q": "等比數列首項 2、公比 3，前 5 項和為何？", "opts": ["486", "121", "242", "243"], "ans": 2, "ex": "關鍵公式：$S_n=\\frac{a_1(r^n-1)}{r-1}$。計算：$\\frac{2(243-1)}{2}=242$。常見錯誤：忘了乘首項或除以 $r-1$，得 243 或 121；486 是第 6 項。"}, {"q": "三數成等差，和為 30，且最大數與最小數之積為 64，則最大數為何？", "opts": ["6", "10", "14", "16"], "ans": 3, "ex": "關鍵公式：設三數為 $a-d,\\ a,\\ a+d$。計算：和 $3a=30\\Rightarrow a=10$；$(10-d)(10+d)=100-d^2=64\\Rightarrow d^2=36$，$d=\\pm6$，三數為 4、10、16，最大 16。常見錯誤：只設 $a,a+d,a+2d$ 增加計算量；14 是 $d=4$ 的誤算。"}], "tcte": [{"q": "等差數列 $a_3=7,\\ a_8=22$，則前 10 項和為何？", "opts": ["150", "155", "145", "140"], "ans": 2, "ex": "關鍵公式：$a_8-a_3=5d$，$S_n=\\frac n2(2a_1+(n-1)d)$。計算：$d=3,\\ a_1=1$，$S_{10}=5(2+27)=145$。常見錯誤：把 $a_3$ 當首項；算成 $d=\\frac{22-7}{8-3+1}$。"}, {"q": "等比數列 $a_2=6,\\ a_5=162$，則前 4 項和為何？", "opts": ["80", "78", "242", "120"], "ans": 0, "ex": "關鍵公式：$\\frac{a_5}{a_2}=r^3$，$S_n=\\frac{a_1(r^n-1)}{r-1}$。計算：$r^3=27,\\ r=3,\\ a_1=2$，$S_4=\\frac{2(81-1)}2=80$。常見錯誤：把 27 當公比；242 是 $S_5$。"}, {"q": "100 到 999 之間，所有 7 的倍數之和為何？", "opts": ["70336", "70434", "69342", "71071"], "ans": 0, "ex": "關鍵公式：等差和。計算：首項 105、末項 994，項數 $\\frac{994-105}7+1=128$，和 $=\\frac{128(105+994)}2=70336$。常見錯誤：把 98 納入（<100）得 70434；項數少算 1 得 69342。"}], "cards": [{"front": "等差通項", "back": "$a_n=a_1+(n-1)d$。"}, {"front": "等差和", "back": "$S_n=\\frac n2(a_1+a_n)$。"}, {"front": "等比通項", "back": "$a_n=a_1r^{n-1}$。"}, {"front": "等比和", "back": "$S_n=\\frac{a_1(r^n-1)}{r-1}$（$r\\ne1$）。"}, {"front": "成等差設法", "back": "三數：$a-d,a,a+d$；成等比：$\\frac ar,a,ar$。"}], "quick": [1, 3, 4], "task": {"title": "階梯座位", "scenario": "體育館第 1 排 20 個座位，每排多 2 個，共 15 排。", "steps": ["求第 15 排座位數", "求總座位數", "若改成每排多 10%（等比），比較總數"], "answer": "等差：$a_{15}=20+14\\cdot2=48$；$S=\\frac{15(20+48)}2=510$。等比 $r=1.1$：$S=\\frac{20(1.1^{15}-1)}{0.1}\\approx635.4$，等比總數較多。", "time": "20 分鐘：8 等差、6 等比、6 比較"}}, {"id": "mathb_u1_6", "title": "指數對數與數列級數（1-6）無窮等比級數與 Σ 性質", "subject": "數學B", "kind": "quiz", "on": true, "desc": "無窮等 // 部署 Apps Script 後，把網頁應用程式網址貼在這裡；空字串＝只存本機、不上傳
const LOG_URL="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S={tab:'quiz',u:0,i:0,done:false,picked:null,t0:Date.now(),score:0,list:null,card:0,back:false,tea:false,qk:'q'};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let me=LS.get('mb_me',null);
const TABS=[['quiz','搶答'],['task','小組任務'],['card','概念卡＋小測'],['tcte','統測題'],['mock','統測模擬'],['rec','我的紀錄']];

function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
function render(h){$('#app').innerHTML=h;typeset()}
function drawTabs(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" data-k="${k}">${n}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.i=0;S.done=false;S.picked=null;S.score=0;S.card=0;S.back=false;S.list=null;go()})}
function chips(){return `<div class="chips">`+UNITS.map((u,i)=>`<button class="chip ${S.u===i?'on':''}" data-u="${i}">${esc(u.title.replace(/^.*（(\d-\d)）/,'$1 '))}</button>`).join('')+`</div>`}
function bindChips(){document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.u=+b.dataset.u;S.i=0;S.done=false;S.picked=null;S.score=0;S.card=0;S.back=false;S.list=null;go()})}

// ---- logging ----
function logRow(unit,qid,choice,ok,secs){
 if(!me)return;
 const row=[new Date().toISOString(),me.c,me.s,unit,qid,choice,ok?1:0,secs];
 const all=LS.get('mb_log',[]);all.push(row);LS.set('mb_log',all);
 if(LOG_URL){
  const q=LS.get('mb_q',[]);q.push(row);LS.set('mb_q',q);flush();
 }
}
let flushing=false;
async function flush(){
 if(!LOG_URL||flushing)return;const q=LS.get('mb_q',[]);if(!q.length)return;flushing=true;
 try{await fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({rows:q})});LS.set('mb_q',[])}catch(e){}
 flushing=false;
}
window.addEventListener('online',flush);

// ---- question runner ----
function runner(list,unitLabel,key,title){
 if(S.done){
  const pct=Math.round(S.score/list.length*100);
  render(`<div class="card"><h2 style="margin-top:0">${title}完成</h2><p>答對 <b>${S.score}</b> / ${list.length}（${pct}%）</p>
   <p class="muted">${pct>=80?'很穩，可以挑戰統測題。':pct>=60?'再看一次解析，把錯的題補起來。':'建議回到概念卡複習，再重做一次。'}</p>
   <button class="btn" id="again">再做一次</button></div>`);
  $('#again').onclick=()=>{S.i=0;S.score=0;S.done=false;S.picked=null;S.list=null;go()};return;
 }
 const q=list[S.i];const L='ABCD';
 const shown=S.picked!==null;
 render(`<div class="prog"><i style="width:${S.i/list.length*100}%"></i></div>
  <div class="card"><div class="muted">${esc(unitLabel)}・第 ${S.i+1} / ${list.length} 題</div>
  <p style="font-size:1.1em">${q.q}</p>
  ${q.opts.map((o,k)=>`<button class="opt ${shown?(k===q.ans?'right':(k===S.picked?'wrong':'')):''}" data-k="${k}" ${shown?'disabled':''}>(${L[k]}) ${o}</button>`).join('')}
  ${shown?`<div class="${S.picked===q.ans?'good':'bad'}"><b>${S.picked===q.ans?'答對了':'答錯了，正確答案 ('+L[q.ans]+')'}</b></div><div class="ex">${q.ex}</div>
  <p><button class="btn" id="next">${S.i+1<list.length?'下一題':'看結果'}</button></p>`:''}
  </div>`);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(S.picked!==null)return;const k=+b.dataset.k;S.picked=k;const ok=k===q.ans;if(ok)S.score++;
  logRow(q._unit||unitLabel,(q._id||key+(S.i+1)),L[k],ok,Math.round((Date.now()-S.t0)/1000));runner(list,unitLabel,key,title)});
 const n=$('#next');if(n)n.onclick=()=>{S.picked=null;S.t0=Date.now();if(S.i+1<list.length)S.i++;else S.done=true;runner(list,unitLabel,key,title)};
 if(!shown)S.t0=S.t0||Date.now();
}

function go(){drawTabs();const u=UNITS[S.u];S.t0=Date.now();
 if(S.tab==='quiz'){render(chips()+'<div id="q"></div>');bindChips();const a=document.createElement('div');$('#q').replaceWith(a);
   S.t0=Date.now();const keep=$('#app').innerHTML;runnerIn(a,u.quiz,u.id,'q','搶答');}
 else if(S.tab==='tcte'){render(chips()+'<div id="q"></div>');bindChips();runnerIn($('#q'),u.tcte,u.id,'t','統測題');}
 else if(S.tab==='task')task(u);
 else if(S.tab==='card')cards(u);
 else if(S.tab==='mock')mock();
 else rec();
}
// runner rendering inside a container (keeps chips above)
function runnerIn(el,list,unitId,key,title){
 const saveRender=render;
 const head=$('#app').innerHTML.split('<div id="q"></div>')[0]||'';
 const keepHead=document.querySelector('.chips')?document.querySelector('.chips').outerHTML:'';
 window.render=h=>{ $('#app').innerHTML=keepHead+h;bindChips();typeset()};
 try{runner(list,unitId,key,title)}finally{window.render=saveRender}
 // re-bind next/option handlers to use the same wrapper
 rewire(list,unitId,key,title,keepHead);
}
function rewire(list,unitId,key,title,keepHead){
 const wrap=()=>{window.render=h=>{$('#app').innerHTML=keepHead+h;bindChips();typeset()}};
 const orig=window.render;
 document.querySelectorAll('.opt,#next,#again').forEach(b=>{const f=b.onclick;b.onclick=e=>{wrap();try{f.call(b,e)}finally{window.render=render0}}});
}
const render0=render;

function task(u){const t=u.task;
 render(chips()+`<div class="card"><h2 style="margin-top:0">${t.title}</h2><p>${t.scenario}</p>
  <ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  <p class="muted">建議時間：${esc(t.time)}</p></div>
  ${S.tea?`<div class="card" style="border-color:var(--yuzu)"><b class="warn">教師參考答案</b><p>${t.answer}</p></div>`:'<p class="muted">老師可按右上「教師解答」顯示參考答案。</p>'}`);
 bindChips()}
function cards(u){
 if(S.mode==='quick'){return}
 const c=u.cards;const cd=c[S.card];
 render(chips()+`<div class="card"><div class="muted">概念卡 ${S.card+1} / ${c.length}（點卡片翻面）</div>
  <button class="flip ${S.back?'back':''}" id="fl">${S.back?cd.back:cd.front}</button>
  <p class="row"><button class="btn ghost" id="pv" ${S.card?'':'disabled'}>上一張</button><button class="btn ghost" id="nx" ${S.card+1<c.length?'':'disabled'}>下一張</button>
  <button class="btn" id="qk">課前／課後小測（${u.quick.length} 題）</button></p></div>`);
 bindChips();
 $('#fl').onclick=()=>{S.back=!S.back;cards(u)};
 $('#pv').onclick=()=>{S.card--;S.back=false;cards(u)};
 $('#nx').onclick=()=>{S.card++;S.back=false;cards(u)};
 $('#qk').onclick=()=>{const l=u.quick.map(i=>({...u.quiz[i],_id:'k'+(i+1)}));S.i=0;S.score=0;S.done=false;S.picked=null;quickRun(l,u)};
}
function quickRun(l,u){
 const back=()=>{S.tab='card';S.back=false;go()};
 const orig=window.render;
 const run=()=>{window.render=h=>{$('#app').innerHTML=`<p><button class="tbtn" id="bk">← 回概念卡</button></p>`+h;$('#bk').onclick=back;typeset()};
  runner(l,u.id,'k','小測');window.render=orig;
  document.querySelectorAll('.opt,#next,#again').forEach(b=>{const f=b.onclick;b.onclick=e=>{window.render=(h)=>{$('#app').innerHTML=`<p><button class="tbtn" id="bk">← 回概念卡</button></p>`+h;$('#bk').onclick=back;typeset()};try{f.call(b,e)}finally{window.render=orig}}})};
 run();
}
function mock(){
 if(!S.list){const all=[];UNITS.forEach(u=>u.tcte.forEach((q,i)=>all.push({...q,_unit:u.id,_id:'m'+(i+1)})));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  S.list=all.slice(0,10);S.i=0;S.score=0;S.done=false;S.picked=null}
 const orig=window.render;
 const w=h=>{$('#app').innerHTML=`<p class="muted">統測模擬：從 6 個子單元的統測題隨機抽 10 題。</p>`+h;typeset()};
 window.render=w;runner(S.list,'統測模擬','m','統測模擬');window.render=orig;
 document.querySelectorAll('.opt,#next,#again').forEach(b=>{const f=b.onclick;b.onclick=e=>{window.render=w;try{f.call(b,e)}finally{window.render=orig}}});
}
function rec(){const all=LS.get('mb_log',[]);const n=all.length,ok=all.filter(r=>r[6]).length;
 const by={};all.forEach(r=>{(by[r[3]]=by[r[3]]||[0,0]);by[r[3]][0]++;by[r[3]][1]+=r[6]});
 render(`<div class="card"><h2 style="margin-top:0">我的紀錄（這支手機）</h2>
  <p>共作答 ${n} 題，答對 ${ok} 題。${LOG_URL?'':'<span class="muted">（目前為離線模式，尚未上傳老師的試算表）</span>'}</p>
  <table><tr><th>單元</th><th>題數</th><th>答對</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">還沒有紀錄</td></tr>'}</table></div>`)}

function who(){$('#who').textContent=me?`${me.c} 班 ${me.s} 號`:'未登入'}
function askLogin(){$('#login').style.display='flex'}
$('#lgo').onclick=()=>{const c=$('#lc').value.trim(),s=$('#ls').value.trim();
 if(!/^[0-9A-Za-z]{1,10}$/.test(c)||!/^\d{1,2}$/.test(s)){alert('請輸入班級（如 101）與座號（數字）');return}
 me={c,s:+s};LS.set('mb_me',me);$('#login').style.display='none';who();go()};
$('#btnWho').onclick=askLogin;
$('#btnProj').onclick=e=>{document.body.classList.toggle('proj');e.target.classList.toggle('on')};
$('#btnTea').onclick=e=>{S.tea=!S.tea;e.target.classList.toggle('on');go()};
who();if(!me)askLogin();go();flush();
</script>
